<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aprenda teclado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body.dark{--bg:#14161c;--card:#1e212a;--card2:#282c38;--line:#343947;--text:#f2f2f5;--muted:#9ba1ae;--accent:#f5b83d;--topbg:rgba(20,22,28,.96);--kbbg:#0d0e12;
  --fall1:#171a21;--fall2:#1b1f28;--curbg:#3a3220;--exptext:#dfe1e7;--notebg:rgba(245,184,61,.1);--notebd:rgba(245,184,61,.35);--notetx:#f4d793;--handoff:#3a3f4b;--handtx:#cfd3dc;--grid:rgba(255,255,255,.08);--auto:#4a505e;--lanetx:#fff;--shadow:none}
:root{
  --bg:#f6f3ee;--card:#ffffff;--card2:#efebe4;--line:#e3ddd3;--text:#24262d;--muted:#6f7480;
  --accent:#f0a823;--topbg:rgba(246,243,238,.95);--kbbg:#d9d4cc;--fall1:#fbf9f5;--fall2:#efeae2;--curbg:#fff2d6;--exptext:#30333b;
  --notebg:#fff4dc;--notebd:#efc56b;--notetx:#6b4a00;--handoff:#d6d1c8;--handtx:#4a4e58;--grid:rgba(0,0,0,.09);--auto:#c9c4bb;--lanetx:#24262d;--shadow:0 1px 3px rgba(0,0,0,.08);--ok:#3ecf8e;--bad:#ef5b5b;--blue:#5aa9ff;
  --f1:#ff6b6b;--f2:#ffa94d;--f3:#ffd43b;--f4:#69db7c;--f5:#4dabf7;
  --kbh:clamp(110px,27vh,190px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-size:15px}
body.kb-on main{padding-bottom:calc(var(--kbh) + 18px)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:700;font-size:14px;color:var(--text)}
select,input{font-family:inherit}
.hidden{display:none!important}
/* topo */
#top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#top .ttl{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card2);padding:8px 11px;font-size:14px}
#inChip{background:var(--card2);color:var(--muted);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
#inChip.on{background:rgba(62,207,142,.16);color:var(--ok)}
main{max-width:900px;margin:0 auto;padding:14px 12px 30px}
h1{font-size:24px;margin:4px 0 4px;font-weight:800}
h2{font-size:17px;margin:20px 0 10px;font-weight:800}
h3{font-size:15px;margin:0 0 6px;font-weight:800}
.card{box-shadow:var(--shadow);background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
p{line-height:1.5;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card2);padding:10px 14px}
.btn.primary{background:var(--accent);color:#1b1404}
.li,.tile{color:var(--text)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{box-shadow:var(--shadow);background:var(--card);border-radius:16px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile .ic{font-size:26px}
.tile b{font-size:16px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11.5px;color:var(--muted)}
.mod{margin-bottom:16px}
.modh{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.modh b{font-size:16px}.modh span{font-size:12px;color:var(--muted)}
.li{box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:7px;width:100%;text-align:left}
.li .n{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}
.li.done .n{background:var(--ok);color:#06281a}
.li .t{font-weight:800;font-size:14.5px}
.li .d{font-size:12px;color:var(--muted);font-weight:600}
.li .st{margin-left:auto;color:var(--accent);flex:none;letter-spacing:1px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin-right:4px}
.obj{border-left:4px solid var(--accent)}
.exp p{color:var(--exptext)}
.exp ul{margin:0 0 6px;padding-left:18px;line-height:1.5;color:var(--exptext)}
.fb{min-height:22px;text-align:center;font-weight:700;margin-top:8px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.prompt{text-align:center;font-size:15px;color:var(--muted);font-weight:700}
.prompt .big{display:block;font-size:52px;line-height:1.1;font-weight:800;color:var(--accent);margin:4px 0}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.opt{min-width:56px;padding:12px 14px;font-size:16px;background:var(--card2)}
.opt.right{background:var(--ok);color:#05301c}.opt.wrong{background:var(--bad);color:#fff}
.exhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.cnt{font-size:12px;color:var(--muted);font-weight:800}
.result{text-align:center;padding:10px 0}
.result .stars{font-size:40px;color:var(--accent);letter-spacing:4px}
.result .pct{font-size:22px;font-weight:800}
/* configuração */
.setg{margin-bottom:14px}
.setg h3{margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--card2);padding:9px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#1b1404}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.note{background:var(--notebg);border:1px solid var(--notebd);color:var(--notetx);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px}
/* player */
.lv{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:var(--card2);margin-bottom:6px;cursor:pointer}
.lv.on{outline:2px solid var(--accent)}
.lv b{font-size:14px}.lv span{display:block;font-size:12px;color:var(--muted)}
.lv i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.ctl{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.ctl label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.ctl input[type=range]{flex:1;accent-color:var(--accent)}
.ctl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.ctl select{background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:8px}
.pstatus{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin:6px 0}
.bleed{display:block;width:100vw;margin-left:calc(50% - 50vw)}
#fall{height:clamp(120px,34vh,240px);background:linear-gradient(var(--fall1),var(--fall2))}
.lane{display:flex;gap:6px;overflow:hidden;padding:6px 0;min-height:86px;align-items:stretch}
.lc{flex:none;min-width:54px;border-radius:12px;background:var(--card2);padding:6px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;opacity:.85}
.lc.cur{background:var(--curbg);outline:2px solid var(--accent);opacity:1;transform:scale(1.04)}
.lc.past{opacity:.35}
.lc .lab{font-size:11px;color:var(--accent);font-weight:800}
.lc .nm{font-size:15px;font-weight:800;line-height:1.15}
.lc .fg{font-size:24px;font-weight:800;line-height:1.05}
.lc .hd{font-size:10px;color:var(--muted);font-weight:800}
.staffbox{background:#f7f4ec;border-radius:12px;overflow:hidden}
.hands-row{display:flex;justify-content:center;margin:6px 0}
.hands-row svg{width:min(320px,90%);height:auto}
.handsbig svg{width:min(360px,95%);height:auto;display:block;margin:0 auto}
/* teclado */
#kbdock{position:fixed;left:0;right:0;bottom:0;height:var(--kbh);background:var(--kbbg);border-top:3px solid #a33a3a;z-index:30;padding-top:4px}
#kb{position:relative;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.wk,.bk{position:absolute;top:0;display:flex;align-items:flex-end;justify-content:center;transition:background .08s}
.wk{height:100%;background:#f5f5f7;border:1px solid #b5b9c2;border-radius:0 0 6px 6px;padding-bottom:6px}
.bk{height:62%;background:#1f2128;border:1px solid #000;border-radius:0 0 4px 4px;z-index:2;padding-bottom:5px}
.wk.down{background:#d3d8e2}.bk.down{background:#4a4f5c}
.kl{font-size:10px;font-weight:800;color:#8d919b;text-align:center;line-height:1.05;pointer-events:none}
.bk .kl{color:#9aa}
.kl.big b{display:block;font-size:17px;color:#111}
.kl.big i{font-style:normal;font-size:9.5px;color:#222}
.bk .kl.big b{font-size:13px}
.wk.mark{background:#d8ecff}.bk.mark{background:#2d5c8c}
.wk.found{background:var(--ok)!important}
.flash-ok{box-shadow:inset 0 0 0 4px var(--ok);background:#b9f5d8!important}
.bk.flash-ok{background:#1f9e6a!important}
.flash-bad{box-shadow:inset 0 0 0 4px var(--bad);background:#ffc9c9!important}
.bk.flash-bad{background:#b33!important}
.cdot{position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--blue)}
.chordnow{font-size:44px;font-weight:800;text-align:center;color:var(--accent)}
.chart{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chart span{padding:8px 12px;border-radius:10px;background:var(--card2);font-weight:800}
.chart span.cur{background:var(--accent);color:#1b1404}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
@media (min-width:700px){.grid2{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="top">
  <button class="ib" id="backBtn">←</button>
  <div class="ttl" id="ttl">Aprenda teclado</div>
  <span id="inChip">👆 Tela</span>
  <button class="ib" id="aboutBtn" title="Sobre">ℹ️</button>
  <button class="ib" id="noteBtn" title="Anotar problema">📝</button>
  <button class="ib" id="setBtn">⚙</button>
</div>
<main id="view"></main>
<div id="kbdock" class="hidden"><div id="kb"></div></div>

<script>
"use strict";
/* =========================================================
   UTILIDADES, CONFIGURAÇÕES E PROGRESSO
   ========================================================= */
const $=s=>document.querySelector(s);
const mod=(a,n)=>((a%n)+n)%n;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ST={get(k,d){try{const v=localStorage.getItem('at_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('at_'+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({theme:'light',notation:'falling',names:'solfa',input:'touch',hands:false,headphones:false,allNames:false,keySound:true},ST.get('settings',{}));
if(!S.handsV2){S.hands=false;S.handsV2=true;ST.set('settings',S)}
function saveSettings(){ST.set('settings',S)}
let PROG=ST.get('prog',{}), DAYS=ST.get('days',[]);
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function markDay(){const k=dayKey(new Date());if(!DAYS.includes(k)){DAYS.push(k);ST.set('days',DAYS)}}
function streak(){const s=new Set(DAYS);let n=0;const d=new Date();if(!s.has(dayKey(d)))d.setDate(d.getDate()-1);while(s.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function saveScore(key,stars,acc){if(!key)return;const p=PROG[key];if(!p||p.stars<stars||p.acc<acc)PROG[key]={stars:Math.max(stars,p?p.stars:0),acc:Math.max(acc,p?p.acc:0)};PROG[key].d=dayKey(new Date());ST.set('prog',PROG);markDay();if(window.checkAch)setTimeout(checkAch,60)}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);

/* nomes das notas */
const SOL=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const LET=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLb={1:'Ré♭',3:'Mi♭',6:'Sol♭',8:'Lá♭',10:'Si♭'}, LETb={1:'D♭',3:'E♭',6:'G♭',8:'A♭',10:'B♭'};
function nn(m,sp){const pc=mod(m,12);if(S.names==='letters')return sp==='b'&&LETb[pc]?LETb[pc]:LET[pc];return sp==='b'&&SOLb[pc]?SOLb[pc]:SOL[pc]}
const oct=m=>Math.floor(m/12)-1;
const isBlack=m=>[1,3,6,8,10].includes(mod(m,12));
const FC={1:'#ff6b6b',2:'#ffa94d',3:'#ffd43b',4:'#69db7c',5:'#4dabf7'};
const FNAME={1:'polegar',2:'indicador',3:'médio',4:'anelar',5:'mindinho'};

/* =========================================================
   ÁUDIO (sintetizador, bateria, metrônomo)
   ========================================================= */
let AC=null, master=null, session=null, micMuteUntil=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function newSession(){endSession();const c=ac();const g=c.createGain();g.connect(master);session={g};return session}
function endSession(){if(session){try{session.g.gain.setValueAtTime(0,AC.currentTime);session.g.disconnect()}catch(e){}session=null}}
function noteMute(end){if(S.headphones||!AC)return;const ms=performance.now()+(end-AC.currentTime)*1000+180;if(ms>micMuteUntil)micMuteUntil=ms}
const TIMBRES={
  piano:{w:[['sine',1,1],['sine',2,.35],['triangle',3,.08]],a:.006,dec:.9,sus:.18,rel:.25},
  epiano:{w:[['sine',1,1],['sine',4,.18]],a:.004,dec:1.2,sus:.15,rel:.3},
  organ:{w:[['square',1,.3],['sine',2,.4],['sine',4,.15]],a:.01,dec:0,sus:1,rel:.06,lp:2400},
  strings:{w:[['sawtooth',1,.45],['sawtooth',1.004,.35]],a:.18,dec:0,sus:1,rel:.35,lp:1800},
  flute:{w:[['sine',1,1],['sine',2,.08]],a:.06,dec:0,sus:1,rel:.12,vib:4},
  bass:{w:[['triangle',1,1],['sine',2,.25]],a:.005,dec:.5,sus:.35,rel:.12,lp:900}
};
const TNAME={piano:'Piano',epiano:'Piano elétrico',organ:'Órgão',strings:'Cordas',flute:'Flauta',bass:'Baixo'};
function tone(m,when,dur,o={}){
  const c=ac(),T=TIMBRES[o.timbre||'piano'],vel=o.vel??.28;
  const t=Math.max(when||0,c.currentTime),f=440*Math.pow(2,(m-69)/12);
  const g=c.createGain();let node=g;
  if(T.lp){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=T.lp;g.connect(lp);node=lp}
  node.connect(o.dest||(session?session.g:master));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+T.a);
  if(T.dec>0)g.gain.setTargetAtTime(vel*T.sus,t+T.a,T.dec/3);
  const end=t+Math.max(dur,T.a+.03);g.gain.setTargetAtTime(0,end,T.rel/3);
  const stop=end+T.rel*2+.05;
  T.w.forEach(([type,mul,amp])=>{const osc=c.createOscillator();osc.type=type;osc.frequency.value=f*mul;const og=c.createGain();og.gain.value=amp;osc.connect(og);og.connect(g);
    if(T.vib){const l=c.createOscillator();l.frequency.value=5;const lg=c.createGain();lg.gain.value=T.vib*mul;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(stop)}
    osc.start(t);osc.stop(stop)});
  noteMute(stop);
}
let NOISE=null;
function noiseBuf(){if(!NOISE){const c=ac();NOISE=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NOISE}
function drum(type,when,vol=1){
  const c=ac(),t=Math.max(when,c.currentTime),dest=session?session.g:master;
  if(type==='kick'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.7*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.3)}
  else if(type==='click'||type==='accent'){const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=type==='accent'?1900:1200;g.gain.setValueAtTime(.16*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.06)}
  else{const s=c.createBufferSource();s.buffer=noiseBuf();const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=type==='hat'?7000:1500;const g=c.createGain();const len=type==='hat'?.05:.16;g.gain.setValueAtTime((type==='hat'?.1:.3)*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+len+.02)}
  noteMute(t+.3);
}
function playChordNow(ms,dur=1.2,timbre='piano'){const c=ac();ms.forEach(m=>tone(m,c.currentTime,dur,{timbre,vel:.2}))}
function playSeqNow(ms,gap=.5,dur=.45){const c=ac();ms.forEach((m,i)=>{if(m!=null)(Array.isArray(m)?m:[m]).forEach(mm=>tone(mm,c.currentTime+.05+i*gap,dur))})}

/* =========================================================
   TECLADO FIXO NA TELA
   ========================================================= */
const KB={lo:48,hi:84,els:{}};
let TARGETS=new Map();           // midi -> {f,sp}
let touchTimbre=()=> 'piano';
function buildKB(lo,hi){
  if(KB.lo===lo&&KB.hi===hi&&Object.keys(KB.els).length)return;
  KB.lo=lo;KB.hi=hi;const kb=$('#kb');kb.innerHTML='';KB.els={};
  const whites=[];for(let m=lo;m<=hi;m++)if(!isBlack(m))whites.push(m);
  const ww=100/whites.length;let wi=0;
  for(let m=lo;m<=hi;m++){
    const el=document.createElement('div');el.dataset.m=m;
    if(!isBlack(m)){el.className='wk';el.style.left=(wi*ww)+'%';el.style.width=ww+'%';wi++}
    else{el.className='bk';el.style.left=(wi*ww-ww*.3)+'%';el.style.width=(ww*.6)+'%'}
    el.innerHTML=(m===60?'<span class="cdot"></span>':'')+'<span class="kl"></span>';
    kb.appendChild(el);KB.els[m]=el;
  }
  refreshKeys();
}
function refreshKeys(){
  for(const k in KB.els){const m=+k,el=KB.els[k],lab=el.querySelector('.kl'),t=TARGETS.get(m);
    el.style.background='';
    if(t){el.style.background=t.f?FC[t.f]:'var(--accent)';lab.className='kl big';
      lab.innerHTML=t.f?`<b>${t.f}</b><i>${nn(m,t.sp)}</i>`:`<b>${nn(m,t.sp)}</b>`}
    else{lab.className='kl';lab.textContent=(!isBlack(m)&&(S.allNames||mod(m,12)===0))?nn(m)+(mod(m,12)===0?oct(m):''):''}
  }
}
function setTargets(list){TARGETS=new Map();(list||[]).forEach(n=>TARGETS.set(n.m,{f:n.f,sp:n.sp}));refreshKeys()}
function keyFor(m){if(KB.els[m])return KB.els[m];let x=m;while(x<KB.lo)x+=12;while(x>KB.hi)x-=12;return KB.els[x]}
function flashKey(m,kind){const el=keyFor(m);if(!el)return;const c='flash-'+kind;el.classList.add(c);setTimeout(()=>el.classList.remove(c),320)}
function markKeys(pred,cls){for(const k in KB.els){KB.els[k].classList.toggle(cls,!!pred(+k))}}
function clearMarks(){for(const k in KB.els)KB.els[k].classList.remove('mark','found')}

let micPeak=0,PEDALCB=null,micStream=null,analyser=null,abuf=null,micTimer=null,lastPc=-1,stableN=0,smRms=0,onsetAt=0,armed=true,accPc=-1,MICVIEW=null;
async function startMic(){
  stopMic();
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){S.input='touch';saveSettings();updChip();return 'O navegador bloqueou o microfone. Abra o app por um endereço https (ex.: GitHub Pages) no Chrome e permita o microfone.'}
  const c=ac(),src=c.createMediaStreamSource(micStream);analyser=c.createAnalyser();analyser.fftSize=2048;src.connect(analyser);
  abuf=new Float32Array(analyser.fftSize);micTimer=setInterval(micTick,35);S.input='mic';saveSettings();updChip();return '';
}
function stopMic(){if(micTimer)clearInterval(micTimer);micTimer=null;if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null}
function autoCorr(b,sr){
  let n=b.length,rms=0;for(let i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<.008)return{f:-1,rms};
  let r1=0,r2=n-1;for(let i=0;i<n/2;i++)if(Math.abs(b[i])<.2){r1=i;break}for(let i=1;i<n/2;i++)if(Math.abs(b[n-i])<.2){r2=n-i;break}
  b=b.slice(r1,r2);n=b.length;if(n<200)return{f:-1,rms};
  const ML=Math.min(n,Math.floor(sr/55)),c=new Float32Array(ML);
  for(let i=0;i<ML;i++){let s=0;for(let j=0;j<n-i;j++)s+=b[j]*b[j+i];c[i]=s}
  let d=0;while(d<ML-1&&c[d]>c[d+1])d++;let mv=-1,mp=-1;for(let i=d;i<ML;i++)if(c[i]>mv){mv=c[i];mp=i}
  if(mp<=0||mp>=ML-1)return{f:-1,rms};const x1=c[mp-1],x2=c[mp],x3=c[mp+1],A=(x1+x3-2*x2)/2,B=(x3-x1)/2;
  return{f:sr/(A?mp-B/(2*A):mp),rms};
}
function micTick(){
  analyser.getFloatTimeDomainData(abuf);const now=performance.now();
  if(now<micMuteUntil){stableN=0;lastPc=-1;smRms=0;return}
  const{f,rms}=autoCorr(abuf,AC.sampleRate);
  if(rms>smRms*1.35&&rms>.015){onsetAt=now;armed=true}smRms=smRms*.7+rms*.3;micPeak=Math.max(rms,micPeak*.85);
  if(MICVIEW)MICVIEW(f,rms);
  if(f<60||f>2100){stableN=0;lastPc=-1;return}
  const m=Math.round(69+12*Math.log2(f/440)),pc=mod(m,12);
  if(pc===lastPc)stableN++;else{stableN=1;lastPc=pc;if(pc!==accPc)armed=true}
  if(stableN>=2&&armed&&(now-onsetAt<400||pc!==accPc)){armed=false;accPc=pc;noteOn(m,'mic',micPeak)}
}
let midiAcc=null,midiCount=0;
async function startMidi(){
  try{if(!navigator.requestMIDIAccess)throw 0;midiAcc=await navigator.requestMIDIAccess()}
  catch(e){return 'Este navegador não liberou o acesso USB/MIDI. Use o Chrome do Android abrindo o app por um endereço https.'}
  const hook=()=>{midiCount=0;midiAcc.inputs.forEach(inp=>{midiCount++;inp.onmidimessage=ev=>{const[s,n,v]=ev.data;if((s&0xf0)===0x90&&v>0)noteOn(n,'midi',v/127);else if((s&0xf0)===0xB0&&n===64&&PEDALCB)PEDALCB(v>=64)}});updChip()};
  midiAcc.onstatechange=hook;stopMic();S.input='midi';saveSettings();hook();
  return midiCount?'':'Nenhum teclado USB encontrado. Ligue o cabo OTG e o teclado; ele aparece aqui automaticamente.';
}
function updChip(){const c=$('#inChip');
  if(S.input==='mic'&&micStream&&AC&&AC.state!=='running'){c.textContent='🎤 Toque na tela';c.classList.remove('on')}
  else if(S.input==='mic'&&micStream){c.textContent='🎤 Microfone';c.classList.add('on')}
  else if(S.input==='midi'&&midiAcc){c.textContent=midiCount?'🔌 USB ligado':'🔌 USB: nenhum';c.classList.toggle('on',midiCount>0)}
  else{c.textContent='👆 Tela';c.classList.remove('on')}}

const LETI=[0,0,1,1,2,3,3,4,4,5,5,6];
function dia(m,sp){const pc=mod(m,12);let o=oct(m),li=LETI[pc],acc=isBlack(m)?'#':'';if(sp==='b'&&acc){li++;acc='♭';if(li>6){li=0;o++}}return{d:o*7+li,acc}}
const TB=60,BB=128;
const yT=d=>TB-(d-30)*4, yB=d=>BB-(d-18)*4;
function glyph(x,ys,d,col,up){
  const open=d>=2,stem=d<4,flag=d<1,flag2=d<.5,dot=[3,1.5,.75,.375].includes(d);let s='';
  ys.forEach(y=>{s+=`<ellipse cx="${x}" cy="${y}" rx="5.6" ry="4.1" transform="rotate(-20 ${x} ${y})" fill="${open?'none':col}" stroke="${col}" stroke-width="${open?1.8:1}"/>`;if(dot)s+=`<circle cx="${x+10}" cy="${y-2}" r="1.7" fill="${col}"/>`});
  if(stem){const top=Math.min(...ys),bot=Math.max(...ys);
    if(up){const sx=x+5;s+=`<line x1="${sx}" y1="${bot}" x2="${sx}" y2="${top-26}" stroke="${col}" stroke-width="1.4"/>`;if(flag)s+=`<path d="M${sx} ${top-26} q9 6 6 17" stroke="${col}" fill="none" stroke-width="1.7"/>`;if(flag2)s+=`<path d="M${sx} ${top-19} q9 6 6 17" stroke="${col}" fill="none" stroke-width="1.7"/>`}
    else{const sx=x-5;s+=`<line x1="${sx}" y1="${top}" x2="${sx}" y2="${bot+26}" stroke="${col}" stroke-width="1.4"/>`;if(flag)s+=`<path d="M${sx} ${bot+26} q9 -6 6 -17" stroke="${col}" fill="none" stroke-width="1.7"/>`;if(flag2)s+=`<path d="M${sx} ${bot+19} q9 -6 6 -17" stroke="${col}" fill="none" stroke-width="1.7"/>`}}
  return s;
}
function restGlyph(x,y,d,col){
  if(d>=4)return `<rect x="${x-6}" y="${y}" width="12" height="5" fill="${col}"/>`;
  if(d>=2)return `<rect x="${x-6}" y="${y-5}" width="12" height="5" fill="${col}"/>`;
  if(d>=1)return `<path d="M${x-3} ${y-14} l6 7 l-6 6 l6 7 q-8 -3 -3 6" stroke="${col}" fill="none" stroke-width="2.2"/>`;
  return `<circle cx="${x-2}" cy="${y-6}" r="2.6" fill="${col}"/><path d="M${x-2} ${y-4} q6 2 7 -4 l-5 16" stroke="${col}" fill="none" stroke-width="1.8"/>`;
}
function ledgers(x,d,clef){let s='';const L=(dd)=>{const y=clef==='T'?yT(dd):yB(dd);s+=`<line x1="${x-10}" y1="${y}" x2="${x+10}" y2="${y}" stroke="#333" stroke-width="1.2"/>`};
  if(clef==='T'){for(let dd=28;dd>=d;dd-=2)L(dd);for(let dd=40;dd<=d;dd+=2)L(dd)}else{for(let dd=28;dd<=d;dd+=2)L(dd);for(let dd=16;dd>=d;dd-=2)L(dd)}return s}
function staffSVG(steps,cur,width,opt={}){
  const W=Math.max(260,width),H=158,X0=46,SP=opt.sp||48;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  const showT=opt.clef!=='bass',showB=opt.clef!=='treble';
  if(showT){for(let i=0;i<5;i++)s+=`<line x1="4" y1="${TB-i*8}" x2="${W-4}" y2="${TB-i*8}" stroke="#555" stroke-width="1"/>`;s+=`<circle cx="12" cy="${yT(32)}" r="3.5" fill="#b07a00"/><text x="18" y="${yT(32)+4}" font-size="11" font-weight="800" fill="#b07a00">Sol</text>`}
  if(showB){for(let i=0;i<5;i++)s+=`<line x1="4" y1="${BB-i*8}" x2="${W-4}" y2="${BB-i*8}" stroke="#555" stroke-width="1"/>`;s+=`<circle cx="12" cy="${yB(24)}" r="3.5" fill="#2a6fb0"/><text x="18" y="${yB(24)+4}" font-size="11" font-weight="800" fill="#2a6fb0">Fá</text>`}
  if(showT&&showB)s+=`<line x1="4" y1="${TB-32}" x2="4" y2="${BB}" stroke="#555" stroke-width="2"/>`;
  let lastBar=null;
  steps.forEach((st,i)=>{
    const x=X0+i*SP+SP/2;if(x>W-10)return;
    if(lastBar!=null&&st.bar!=null&&st.bar!==lastBar){s+=`<line x1="${x-SP/2}" y1="${showT?TB-32:BB-32}" x2="${x-SP/2}" y2="${showB?BB:TB}" stroke="#777" stroke-width="1"/>`}
    lastBar=st.bar;
    const state=i===cur?'cur':(i<cur?'past':'next');
    if(state==='cur')s+=`<rect x="${x-SP/2+3}" y="4" width="${SP-6}" height="${H-8}" rx="8" fill="rgba(245,184,61,.22)"/>`;
    if(st.label)s+=`<text x="${x}" y="12" text-anchor="middle" font-size="12" font-weight="800" fill="#7a5200">${st.label}</text>`;
    if(st.rest){s+=restGlyph(x,TB-16,st.rest,state==='past'?'#aaa':'#222');return}
    ['T','B'].forEach(clef=>{
      const ns=st.notes.filter(n=>(opt.clef==='bass'?'B':opt.clef==='treble'?'T':(n.h==='L'?'B':'T'))===clef);if(!ns.length)return;
      const ds=ns.map(n=>dia(n.m,n.sp)),ys=ds.map(o=>clef==='T'?yT(o.d):yB(o.d));
      ds.forEach((o,k)=>{s+=ledgers(x,o.d,clef);if(o.acc)s+=`<text x="${x-17}" y="${ys[k]+4}" font-size="13" font-weight="800" fill="#222">${o.acc}</text>`});
      const col=st.status==='bad'?'#d33':state==='past'?'#9a9a9a':(state==='cur'&&ns[0].f?'#111':'#222');
      const mid=clef==='T'?34:22,avg=ds.reduce((a,o)=>a+o.d,0)/ds.length;
      s+=glyph(x,ys,ns[0].d*(opt.scale||1),col,avg<mid);
      if(!opt.nofingers){const fs=ns.filter(n=>n.f).map(n=>n.f);if(fs.length){
        const fy=clef==='T'?Math.min(TB-36,Math.min(...ys)-(avg<mid?32:10)):Math.max(BB+14,Math.max(...ys)+(avg<mid?14:34));
        const txt=fs.join('');s+=`<rect x="${x-4-txt.length*4}" y="${fy-10}" width="${8+txt.length*8}" height="14" rx="4" fill="${state==='cur'?FC[fs[0]]:'transparent'}"/><text x="${x}" y="${fy+1}" text-anchor="middle" font-size="12" font-weight="800" fill="${state==='past'?'#aaa':'#222'}">${txt}</text>`}}
    });
  });
  return s+'</svg>';
}

   CIFRAS / ACORDES
   ========================================================= */
const PCOF={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const QUAL={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],m7:[0,3,7,10],'7M':[0,4,7,11]};
const QNAME={'':'maior',m:'menor','7':'com sétima',m7:'menor com sétima','7M':'com sétima maior'};
const CHV={ // voicings para a mão direita, com dedos
  C:[[60,64,67],[1,3,5]],Dm:[[62,65,69],[1,3,5]],Em:[[59,64,67],[1,3,5]],F:[[60,65,69],[1,3,5]],G:[[59,62,67],[1,2,5]],Am:[[60,64,69],[1,2,5]],
  G7:[[59,62,65,67],[1,2,3,5]],C7M:[[60,64,67,71],[1,2,3,5]],Dm7:[[60,62,65,69],[1,2,3,5]],Am7:[[60,64,67,69],[1,2,3,5]],A7:[[61,64,67,69],[1,2,3,5]],
  D:[[62,66,69],[1,3,5]],E:[[59,64,68],[1,3,5]],A:[[61,64,69],[1,2,5]],E7:[[59,62,64,68],[1,2,3,5]],D7:[[60,62,66,69],[1,2,3,5]]
};
const BASSM={0:48,1:49,2:50,3:51,4:52,5:41,6:42,7:43,8:44,9:45,10:46,11:47};
function chordInfo(sym){
  const m=/^([A-G])(#|b)?(m7|7M|m|7)?$/.exec(sym);if(!m)return null;
  const root=mod(PCOF[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0),12),q=m[3]||'';
  const pcs=QUAL[q].map(i=>mod(root+i,12));
  let v,f;if(CHV[sym]){[v,f]=CHV[sym]}else{v=pcs.map(p=>60+mod(p-0,12)).sort((a,b)=>a-b);f=v.length===3?[1,3,5]:[1,2,3,5]}
  const rootName=S.names==='letters'?LET[root]:SOL[root];
  return{sym,root,q,pcs,v,f,bass:BASSM[root],fifth:BASSM[mod(root+7,12)],pt:rootName+' '+QNAME[q]};
}
function detectChord(pcsArr){
  const pcs=[...new Set(pcsArr)];if(!pcs.length)return null;
  const nm=p=>LET[p];
  if(pcs.length===1)return nm(pcs[0]);
  for(const r of pcs){const rel=new Set(pcs.map(p=>mod(p-r,12)));
    if(rel.has(4)&&rel.has(10))return nm(r)+'7';if(rel.has(3)&&rel.has(10))return nm(r)+'m7';
    if(rel.has(4)&&rel.has(11))return nm(r)+'7M';if(rel.has(4)&&(rel.has(7)||pcs.length===2))return nm(r);if(rel.has(3)&&(rel.has(7)||pcs.length===2))return nm(r)+'m'}
  return nm(Math.min(...pcsArr));
}

function resultBox(box,acc,detail,again){
  const stars=acc>=95?3:acc>=80?2:1;saveScore(CURKEY,stars,acc);
  box.innerHTML=`<div class="result"><div class="stars">${starStr(stars)}</div><div class="pct">${acc}%</div><p class="muted">${detail}</p><button class="btn primary" id="again">Repetir exercício</button></div>`;
  $('#again').onclick=again;
}
const EX={};

EX.fingers=(box)=>{
  let r=0,ok=0,err=0,cur=null;const N=8;
  box.innerHTML=`<div class="exhead"><b>Qual é o número do dedo aceso?</b><span class="cnt" id="cnt"></span></div><div class="handsbig">${handsSVG('q')}</div><div class="opts">${[1,2,3,4,5].map(n=>`<button class="opt" data-v="${n}">${n}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  const next=()=>{if(r>=N)return resultBox(box,Math.round(ok/(ok+err)*100),`${ok} acertos e ${err} erros`,()=>EX.fingers(box));
    cur={h:Math.random()<.5?'L':'R',f:1+Math.floor(Math.random()*5)};setHands('q',[cur]);$('#cnt').textContent=`${r+1} de ${N}`;$('#fb').className='fb';$('#fb').textContent=`Mão ${cur.h==='L'?'esquerda':'direita'}`};
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.v===cur.f){ok++;r++;$('#fb').className='fb ok';$('#fb').textContent=`Isso! Dedo ${cur.f} = ${FNAME[cur.f]}`;setTimeout(next,700)}else{err++;$('#fb').className='fb bad';$('#fb').textContent='Não é esse. Conte a partir do polegar (1).'}});
  next();
};
EX.fingerinfo=(box)=>{
  box.innerHTML=`<div class="handsbig">${handsSVG('fi')}</div>
   <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px">${[1,2,3,4,5].map(f=>`<div style="background:${FC[f]};border-radius:12px;padding:8px 4px;text-align:center;color:#111"><div style="font-size:24px;font-weight:800">${f}</div><div style="font-size:11.5px;font-weight:800">${FNAME[f]}</div></div>`).join('')}</div>
   <p class="muted small" style="margin-top:10px">A numeração é igual nas duas mãos: o polegar é sempre 1 e o mindinho é sempre 5.</p>`;
  const all=[];['L','R'].forEach(h=>[1,2,3,4,5].forEach(f=>all.push({h,f})));setHands('fi',all);saveScore(CURKEY,3,100);
};
EX.findall=(box,cfg)=>{
  const tg=[];for(let m=KB.lo;m<=KB.hi;m++)if(mod(m,12)===cfg.pc)tg.push(m);const found=new Set();let err=0;const t0=performance.now();
  box.innerHTML=`<div class="prompt">Ache e toque todos os<span class="big">${nn(cfg.pc)}</span><span id="cnt">0 de ${tg.length}</span></div><div class="fb" id="fb"></div>`;
  HANDLER=(m,src)=>{const mm=src==='mic'?tg.find(x=>mod(x,12)===mod(m,12)&&!found.has(x))??m:m;
    if(tg.includes(mm)&&!found.has(mm)){found.add(mm);KB.els[mm].classList.add('found');$('#cnt').textContent=`${found.size} de ${tg.length}`;
      if(found.size===tg.length){const s=((performance.now()-t0)/1000).toFixed(1);HANDLER=null;setTimeout(()=>{clearMarks();resultBox(box,Math.round(tg.length/(tg.length+err)*100),`Todos os ${tg.length} achados em ${s} s, com ${err} erro(s)`,()=>EX.findall(box,cfg))},600)}}
    else if(!tg.includes(mm)){err++;flashKey(m,'bad');$('#fb').className='fb bad';$('#fb').textContent='Essa é '+nn(m)+'. Procure o grupo de 2 pretas.'}};
};
EX.find=(box,cfg)=>{
  let r=0,err=0,cur=null,miss=0;const N=cfg.rounds,t0=performance.now();
  box.innerHTML=`<div class="exhead"><span></span><span class="cnt" id="cnt"></span></div><div class="prompt">Toque<span class="big" id="tg"></span></div><div class="fb" id="fb"></div>`;
  const next=()=>{clearMarks();if(r>=N){HANDLER=null;const s=((performance.now()-t0)/1000/N).toFixed(1);return resultBox(box,Math.round(N/(N+err)*100),`${err} erro(s) · média de ${s} s por nota`,()=>EX.find(box,cfg))}
    let pc;do{pc=rnd(cfg.pool)}while(cur&&pc===cur.pc&&cfg.pool.length>1);
    cur={pc,sp:cfg.mixSp?(Math.random()<.5?'b':''):''};miss=0;$('#tg').textContent=nn(pc,cur.sp);$('#cnt').textContent=`${r+1} de ${N}`;$('#fb').textContent=''};
  HANDLER=m=>{if(mod(m,12)===cur.pc){r++;flashKey(m,'ok');$('#fb').className='fb ok';$('#fb').textContent='Certo!';setTimeout(next,350)}
    else{err++;miss++;flashKey(m,'bad');$('#fb').className='fb bad';$('#fb').textContent='Essa é '+nn(m)+(miss>=2?'. Veja a dica no teclado.':'');if(miss>=2)markKeys(k=>mod(k,12)===cur.pc,'mark')}};
  next();

EX.rhythm=(box,cfg)=>{
  const pat=cfg.pattern.map(p=>typeof p==='number'?{d:p}:{d:p.r,r:true});
  const total=pat.reduce((a,p)=>a+p.d,0);let pos=0;const ons=pat.map(p=>{const o={t:pos,d:p.d,r:p.r};pos+=p.d;return o});
  const draw=(stat)=>{const SPx=Math.min(56,(box.clientWidth-30)/Math.max(total,4));let x=18,s='',W=Math.max(300,total*SPx+40);
    s+=`<line x1="6" y1="50" x2="${W-6}" y2="50" stroke="#666"/>`;
    ons.forEach((o,i)=>{const col=stat?(stat[i]==='good'?'#1a9e64':stat[i]==='ok'?'#c48a00':stat[i]==='miss'?'#d33':'#333'):'#333';
      const cx=x+8;if(mod(o.t,cfg.bpb)===0&&o.t>0)s+=`<line x1="${x-6}" y1="30" x2="${x-6}" y2="70" stroke="#999"/>`;

  box.innerHTML=`<div class="exhead"><span class="muted small">${cfg.bpm} batidas por minuto · ${cfg.bpb} tempos por compasso</span></div><div class="staffbox" id="rsvg" style="padding:6px"></div>

  draw(null);
  const sched=(withNotes,cb)=>{newSession();const c=ac(),bps=cfg.bpm/60,t0=c.currentTime+.3+cfg.bpb/bps;
    for(let k=0;k<cfg.bpb;k++)drum(k===0?'accent':'click',t0-(cfg.bpb-k)/bps);
    for(let bt=0;bt<total;bt++)drum(mod(bt,cfg.bpb)===0?'accent':'click',t0+bt/bps,.8);
    if(withNotes)ons.forEach(o=>{if(!o.r)tone(60,t0+o.t/bps,o.d/bps*.9)});return{t0,bps}};
  $('#rhear').onclick=()=>{sched(true);$('#fb').className='fb';$('#fb').textContent='Ouça e conte junto…'};
  $('#rgo').onclick=()=>{const{t0,bps}=sched(false);const taps=[];$('#fb').className='fb';$('#fb').textContent='Prepare-se: 4 cliques e comece…';
    HANDLER=()=>taps.push(AC.currentTime);
    const id=setTimeout(()=>{HANDLER=null;const stat=[],used=new Set();let good=0,okk=0,n=0;
      ons.forEach((o,i)=>{if(o.r){stat.push('rest');return}n++;const te=t0+o.t/bps;let bi=-1,bd=9;taps.forEach((t,k)=>{if(used.has(k))return;const d=Math.abs(t-te);if(d<bd){bd=d;bi=k}});
        if(bi>=0&&bd<.3){used.add(bi);if(bd<.12){good++;stat.push('good')}else{okk++;stat.push('ok')}}else stat.push('miss')});
      const extra=taps.length-used.size;draw(stat);
      const acc=Math.max(0,Math.round((good+okk*.6-extra*.5)/n*100));
      $('#fb').className='fb';$('#fb').innerHTML=`Verde = no tempo · Amarelo = quase · Vermelho = errou${extra?` · ${extra} toque(s) a mais`:''}`;
      const stars=acc>=95?3:acc>=80?2:1;saveScore(CURKEY,stars,acc);box.insertAdjacentHTML('beforeend',`<div class="result" id="rres"><div class="stars">${starStr(stars)}</div><div class="pct">${acc}% no ritmo</div></div>`);

function xPiece(kind,n){
  const e=(kind==='b'?BOTH:ONE)[n-1];
  if(e.style){const p=stylePiece(e.style);return p}
  const tracks={};
  if(kind==='r')tracks.R=L(e.R,'R');
  else if(kind==='l')tracks.L=L(e.L||mir(e.R),'L');
  else{tracks.R=L(e.R,'R');tracks.L=L(e.L,'L')}
  const ms=Object.values(tracks).flat().map(n=>n.m);
  return mkPiece({bpm:e.bpm,bpb:e.bpb||4,range:autoRange(ms),tracks});
}
const XK={r:{n:'Mão direita',ic:'🫱'},l:{n:'Mão esquerda',ic:'🫲'},b:{n:'Duas mãos',ic:'🙌'}};
function xInfo(kind,n){const e=(kind==='b'?BOTH:ONE)[n-1];return{t:e.t,o:e.o,stage:n<=10?'Básico':n<=20?'Intermediário':'Avançado'}}
function viewExList(kind){
  kind=kind||'r';title('Exercícios progressivos');showKB(false);
  V().innerHTML=`<div class="seg" style="margin-bottom:12px">${Object.entries(XK).map(([k,x])=>`<button data-k="${k}" class="${k===kind?'on':''}">${x.ic} ${x.n}</button>`).join('')}</div>
   <p class="muted small">30 exercícios em ordem crescente de dificuldade: 1–10 básico, 11–20 intermediário, 21–30 avançado. Todos ficam liberados.</p>
   ${[1,11,21].map(st=>`<div class="modh"><b>${xInfo(kind,st).stage}</b><span>exercícios ${st}–${st+9}</span></div>`+Array.from({length:10},(_,i)=>st+i).map(n=>{const x=xInfo(kind,n),p=PROG['x'+kind+n];
     return `<button class="li${p?' done':''}" data-n="${n}"><div class="n">${p?'✓':n}</div><div><div class="t">${x.t}</div><div class="d">${x.o}</div></div><div class="st">${p?starStr(p.stars):''}</div></button>`}).join('')).join('')}`;
  V().querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{HIST.pop();go(viewExList,b.dataset.k)});
  V().querySelectorAll('.li').forEach(b=>b.onclick=()=>go(viewEx,kind,+b.dataset.n));
}
function viewEx(kind,n){
  const x=xInfo(kind,n),pc=xPiece(kind,n);CURKEY='x'+kind+n;title(`${XK[kind].n} · ${n} de 30`);showKB(true,pc.range[0],pc.range[1]);
  V().innerHTML=`<span class="tag">${XK[kind].ic} ${XK[kind].n}</span><span class="tag">${x.stage}</span><h1 style="font-size:21px;margin-top:8px">${n}. ${x.t}</h1>
   <div class="card obj"><h3>🎯 Objetivo</h3><p>${x.o}</p><p class="muted small">Comece com o modo espera ligado. Quando tiver 3 estrelas, desligue o modo espera e aumente a velocidade.</p></div>
   <div class="card" id="xbox"></div>
   <div class="row" style="justify-content:space-between"><button class="btn sm" id="prv" ${n===1?'disabled':''}>← Exercício ${n-1}</button><button class="btn sm" id="nxt" ${n===30?'disabled':''}>Exercício ${n+1} →</button></div>`;
  playSetup($('#xbox'),pc,{levels:false,user:Object.keys(pc.tracks),key:CURKEY});

}

function autoF(items,hand='R'){ // dedilhado automático: escolhe a posição de 5 dedos que atende mais notas seguintes
  const ns=items.map((it,i)=>({i,m:it[0]})).filter(x=>x.m!=null&&!Array.isArray(x.m));let p=null;
  ns.forEach((x,k)=>{const w=WIDX(x.m);if(p==null||w<p||w>p+4){let best=null,bs=-1;
      for(let c=w-4;c<=w;c++){let s=0;for(let j=k;j<Math.min(ns.length,k+8);j++){const ww=WIDX(ns[j].m);if(ww>=c&&ww<=c+4)s++;else break}
        const sc=s*10-(p==null?0:Math.abs(c-p));if(sc>bs){bs=sc;best=c}}p=best}
    const off=w-p;items[x.i][2]=hand==='R'?off+1:5-off});
  return items;
}

function parseMusicXML(text){

function fingerHand(notes,hand){ // dedilhado automático; mantém o dedilhado da partitura quando existe

function bestStreak(){const ds=[...new Set(DAYS)].sort();let best=0,cur=0,prev=null;ds.forEach(k=>{const d=new Date(k+'T12:00:00');if(prev&&(d-prev)/864e5<1.5)cur++;else cur=1;if(cur>best)best=cur;prev=d});return best}
function achStats(){const ks=Object.keys(PROG);const st=ks.reduce((a,k)=>a+(PROG[k].stars||0),0);
  return{lessons:lessonsDone(),ex:ks.filter(k=>/^x[rlb]\d/.test(k)).length,songAny:ks.some(k=>k.startsWith('s:')),
    twoHands:ks.some(k=>/^s:.*:(2|3)$/.test(k)),stage:ks.some(k=>/^s:.*:4$/.test(k)&&PROG[k].stars>=2),
    rep:new Set(ks.filter(k=>/^s:.*:3$/.test(k)).map(k=>k.split(':')[1])).size,three:ks.filter(k=>PROG[k].stars===3).length,stars:st,
    streak:Math.max(bestStreak(),streak()),rt:ST.get('rtbest',0),treino:ST.get('treinoOk',0),mod:MODULES.some(M=>M.ls.every(l=>PROG['l'+l.n])),imp:ST.get('imp',[]).length}}

const today=()=>dayKey(new Date());
const NIVEIS=[
  {n:'Nunca toquei',d:'Começar do zero: postura, notas, ritmo e as primeiras melodias.',mods:[0],ex:{r:[1,10],l:[1,10]},songs:['sino','parab'],maxLv:1},
  {n:'Acho as notas e toco com uma mão',d:'Leitura de partitura, primeiras músicas com as duas mãos.',mods:[1,2],ex:{r:[11,20],l:[11,20],b:[1,10]},songs:['ode','noite','marcha','green'],maxLv:2},
  {n:'Toco devagar com as duas mãos',d:'Escalas, acordes, cifras e independência entre as mãos.',mods:[3,4,9],ex:{r:[21,30],l:[21,30],b:[11,20]},songs:['minu','canon','lib','prel'],maxLv:3},
  {n:'Já toco algumas músicas',d:'Teclado arranjador, estilos brasileiros, ouvido e introduções.',mods:[5,6,7,8],ex:{b:[21,30]},songs:['fe','gym','lib','canon'],maxLv:4}
];
const OBJ={musicas:'Tocar músicas',acordes:'Acompanhar com acordes',partitura:'Ler partitura'};
const GOALMOD={acordes:4,partitura:1};
const stars=k=>PROG[k]?PROG[k].stars:0;
const doneToday=k=>PROG[k]&&PROG[k].d===today();
function lessonPool(plan){const nv=NIVEIS[plan.level];let mods=[...nv.mods];const g=GOALMOD[plan.goal];if(g!=null&&plan.level>=1&&!mods.includes(g))mods.unshift(g);
  return mods.flatMap(mi=>MODULES[mi].ls.map(l=>l.n))}
function exPool(plan){const nv=NIVEIS[plan.level],out=[];const ks=Object.keys(nv.ex);const len=Math.max(...ks.map(k=>nv.ex[k][1]-nv.ex[k][0]+1));
  for(let i=0;i<len;i++)ks.forEach(k=>{const n=nv.ex[k][0]+i;if(n<=nv.ex[k][1])out.push({k,n})});return out}
function buildSession(plan){
  const items=[];const nv=NIVEIS[plan.level];
  // aquecimento
  const warm=plan.level===0?{k:'r',n:1}:plan.level===1?{k:'r',n:3}:{k:'r',n:29};
  items.push({kind:'ex',k:warm.k,n:warm.n,role:'Aquecimento',min:3});
  // lição: primeira sem 3 estrelas
  const lp=lessonPool(plan);const ln=lp.find(n=>stars('l'+n)<3)||lp[lp.length-1];
  items.push({kind:'lesson',n:ln,role:'Lição',min:plan.mins===10?4:7});
  // exercícios
  const ep=exPool(plan).filter(e=>stars('x'+e.k+e.n)<3&&!(e.k===warm.k&&e.n===warm.n));
  const nEx=plan.mins===10?0:plan.mins===20?1:2;
  ep.slice(0,nEx).forEach(e=>items.push({kind:'ex',k:e.k,n:e.n,role:'Exercício',min:5}));
  // revisão (30 min): algo com 1 estrela
  if(plan.mins===30){const rev=Object.keys(PROG).find(k=>PROG[k].stars===1&&!doneToday(k));
    if(rev){if(rev[0]==='l')items.push({kind:'lesson',n:+rev.slice(1),role:'Revisão',min:5});else if(rev[0]==='x')items.push({kind:'ex',k:rev[1],n:+rev.slice(2),role:'Revisão',min:5})}}
  // música: menor nível ainda sem 2 estrelas
  let pick=null;for(let lv=0;lv<=nv.maxLv&&!pick;lv++)for(const id of nv.songs){if(stars('s:'+id+':'+lv)<2){pick={id,lv};break}}
  if(!pick)pick={id:nv.songs[0],lv:nv.maxLv};
  items.push({kind:'song',id:pick.id,lv:pick.lv,role:'Música',min:plan.mins===10?3:5});
  return items;
}
function getSession(){const plan=ST.get('plan',null);if(!plan)return null;let s=ST.get('session',null);
  if(!s||s.date!==today()||s.sig!==JSON.stringify(plan)){s={date:today(),sig:JSON.stringify(plan),items:buildSession(plan)};ST.set('session',s)}return s}
function itemKey(it){return it.kind==='lesson'?'l'+it.n:it.kind==='ex'?'x'+it.k+it.n:'s:'+it.id+':'+it.lv}
function itemLabel(it){if(it.kind==='lesson'){const l=LESSONS[it.n-1];return`Lição ${it.n}: ${l.t}`}
  if(it.kind==='ex'){const x=xInfo(it.k,it.n);return`${XK[it.k].n} ${it.n}: ${x.t}`}
  const s=SONGS.find(x=>x.id===it.id);return`${s.title} · nível ${it.lv+1} (${LEVELS[it.lv].t})`}
function openItem(it){ac();if(it.kind==='lesson')go(viewLesson,it.n);else if(it.kind==='ex')go(viewEx,it.k,it.n);else go(viewSong,it.id,it.lv)}
function levelComplete(plan){const lp=lessonPool(plan),ep=exPool(plan);return lp.every(n=>stars('l'+n)>=2)&&ep.every(e=>stars('x'+e.k+e.n)>=2)}

   ${levelComplete(plan)&&plan.level<3?`<div class="note">Você concluiu o nível ${plan.level+1} com 2 estrelas ou mais em tudo. <button class="btn sm primary" id="tup" style="margin-left:6px">Passar para o nível ${plan.level+2}</button></div>`:''}
   ${s.items.map((it,i)=>{const k=itemKey(it),ok=doneToday(k);return `<button class="li${ok?' done':''}" data-i="${i}"><div class="n">${ok?'✓':i+1}</div><div><div class="d" style="color:var(--accent);font-weight:800">${it.role} · ${it.min} min</div><div class="t">${itemLabel(it)}</div></div><div class="st">${stars(k)?starStr(stars(k)):''}</div></button>`}).join('')}
   ${nxt?`<button class="btn primary" id="tgo" style="width:100%;padding:14px;margin-top:6px">▶ Continuar: ${nxt.role.toLowerCase()}</button>`:''}
   <p class="muted small" style="margin-top:10px">Cada item conta como feito quando você chega ao resultado final (estrelas). Itens com 1 estrela voltam como revisão nos treinos de 30 minutos.</p>`;
  $('#tplan').onclick=()=>go(viewPlan);
  if($('#tup'))$('#tup').onclick=()=>{plan.level++;ST.set('plan',plan);ST.set('session',null);HIST.pop();go(viewToday)};
  V().querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openItem(s.items[+b.dataset.i]));
  if(nxt)$('#tgo').onclick=()=>openItem(nxt);

  const txt=()=>ns.map((n,i)=>`${i+1}. [${n.when}] (${n.ctx} · entrada: ${n.input}) ${n.t}`).join('\n');
  V().innerHTML=`<p class="muted">Use o botão 📝 no topo de qualquer tela para anotar. Depois copie tudo e me mande na conversa.</p>
   <div class="row" style="margin-bottom:12px"><button class="btn primary" id="ncopy" ${ns.length?'':'disabled'}>Copiar tudo</button><button class="btn" id="nnew">📝 Nova anotação</button><button class="btn" id="nclr" ${ns.length?'':'disabled'}>Apagar tudo</button></div>
   <div class="fb" id="nfb"></div>
   ${ns.length?ns.map((n,i)=>`<div class="card"><div class="muted small">${n.when} · ${n.ctx} · ${n.input}</div><p style="margin:6px 0 0">${n.t.replace(/</g,'&lt;')}</p><button class="btn sm" data-del="${i}" style="margin-top:8px">Apagar</button></div>`).join(''):'<div class="card muted">Nenhuma anotação ainda.</div>'}`;
  $('#ncopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt());$('#nfb').className='fb ok';$('#nfb').textContent='Copiado! Agora cole na conversa com o Claude.'}catch(e){
    $('#nfb').className='fb';$('#nfb').innerHTML='Não consegui copiar automaticamente. Selecione e copie o texto abaixo:<textarea rows="6" style="width:100%;margin-top:6px">'+txt().replace(/</g,'&lt;')+'</textarea>'}};
  $('#nnew').onclick=()=>{openNote();const iv=setInterval(()=>{if(!document.querySelector('#ntx')){clearInterval(iv);HIST.pop();go(viewNotes)}},300);addClean(()=>clearInterval(iv))};
  $('#nclr').onclick=()=>{$('#nfb').innerHTML='Apagar todas as anotações? <button class="btn sm" id="nyes">Sim, apagar</button>';$('#nyes').onclick=()=>{ST.set('notes',[]);HIST.pop();go(viewNotes)}};
  V().querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ns.splice(+b.dataset.del,1);ST.set('notes',ns);HIST.pop();go(viewNotes)});
}

/* ---------- Nova tela inicial ---------- */
function viewHome(){
  title('Aprenda teclado',false);showKB(false);
  const plan=ST.get('plan',null),s=plan?getSession():null;
  const sd=SONGS.reduce((a,x)=>a+LEVELS.filter((_,i)=>PROG['s:'+x.id+':'+i]).length,0);
  const done=s?s.items.filter(it=>doneToday(itemKey(it))).length:0;
  V().innerHTML=`<h1>🎹 Aprenda teclado</h1>
   ${plan?`<button class="tile" id="hT" style="width:100%;min-height:0;margin:10px 0 12px;border:2px solid var(--accent)"><span class="ic">🗓️</span><b>Treino do dia</b><span>Nível ${plan.level+1} · ${plan.mins} min · ${done} de ${s.items.length} feitos hoje</span></button>`
     :`<button class="tile" id="hP" style="width:100%;min-height:0;margin:10px 0 12px;border:2px solid var(--accent)"><span class="ic">🧭</span><b>Comece aqui: monte seu plano</b><span>3 perguntas rápidas e o app monta o seu treino de cada dia</span></button>`}
   <div class="card"><div class="stats"><div class="stat"><b>${streak()}</b><span>dias seguidos</span></div><div class="stat"><b>${lessonsDone()}/${LESSONS.length}</b><span>lições</span></div><div class="stat"><b>${Object.keys(PROG).filter(k=>/^x[rlb]\d/.test(k)).length}/90</b><span>exercícios</span></div><div class="stat"><b>${sd}/${SONGS.length*5}</b><span>níveis de música</span></div></div></div>
   <div class="grid2">
    <button class="tile" id="hL"><span class="ic">📚</span><b>Lições</b><span>${MODULES.length} módulos · ${LESSONS.length} lições</span></button>
    <button class="tile" id="hX"><span class="ic">💪</span><b>Exercícios progressivos</b><span>30 mão direita · 30 esquerda · 30 duas mãos</span></button>
    <button class="tile" id="hS"><span class="ic">🎵</span><b>Músicas para aprender</b><span>${SONGS.length} músicas · 5 níveis cada</span></button>
    <button class="tile" id="hK"><span class="ic">🎤</span><b>Teste seu teclado</b><span>Confira se o microfone ou o cabo USB reconhecem as notas</span></button>
    <button class="tile" id="hF"><span class="ic">🎹</span><b>Modo livre</b><span>Toque e veja o nome e a nota na pauta</span></button>
    <button class="tile" id="hN"><span class="ic">📝</span><b>Anotações do teste</b><span>${ST.get('notes',[]).length} anotação(ões) · copiar e enviar</span></button>
    <button class="tile" id="hC"><span class="ic">🏅</span><b>Conquistas</b><span>${ACHS.filter(a=>a.ok(achStats())).length} de ${ACHS.length} conquistadas</span></button>
    <button class="tile" id="hA"><span class="ic">ℹ️</span><b>Sobre</b><span>Como usar, versão e novidades</span></button>
    ${VIA_LINK&&!IS_APP?`<button class="tile instOnly" id="hI" style="${INSTALL_EVT?'':'display:none'}"><span class="ic">📲</span><b>Instalar o app</b><span>Ícone na tela e uso sem internet</span></button>`:''}
   </div>
   <div class="note" style="margin-top:12px">Dica: use o celular <b>deitado</b>. O teclado da tela fica maior e mais fácil de tocar.</div>`;
  if(plan)$('#hT').onclick=()=>go(viewToday);else $('#hP').onclick=()=>go(viewPlan);
  $('#hL').onclick=()=>go(viewLessons);$('#hX').onclick=()=>go(viewExList,'r');$('#hS').onclick=()=>go(viewSongs);
  $('#hK').onclick=()=>go(viewTest);$('#hA').onclick=()=>go(viewAbout);$('#hC').onclick=()=>go(viewAch);if($('#hI'))$('#hI').onclick=installApp;$('#hF').onclick=()=>go(viewFree);$('#hN').onclick=()=>go(viewNotes);
}


/* ---------- Sobre ---------- */
const LINK_APP='https://guidogrcj01-create.github.io/aprenda-teclado/';
const FEITAS=[LESSONS.length+' lições em '+MODULES.length+' módulos','90 exercícios progressivos (mão direita, esquerda e duas mãos)',SONGS.filter(s=>!s.imported).length+' músicas com 5 níveis cada','4 formas de ver as notas (notas caindo, partitura, nomes, dedos)','Dedo indicado em cada nota, com cores','Entrada pela tela, microfone e cabo USB (MIDI)','Plano de estudo por nível','Treino do dia','Teste seu teclado','Anotar problema','Modo livre','Tema claro e escuro','Avaliação do ritmo no modo espera','Importar partitura (MIDI e MusicXML)','Funciona sem internet e pode ser instalado (pelo link)','Dinâmica (forte e piano) e pedal','Conquistas'];
const FALTAM=['Som de piano real','Microfone ajustado com testes em teclados reais','Tocar com a cifra','Completar a Gymnopédie e a Marcha Nupcial','Progresso salvo na nuvem','Publicação na Play Store'];
function viewAbout(){
  title('Sobre');showKB(false);
  const f=FEITAS.length;
  V().innerHTML=`<h1>🎹 Aprenda teclado</h1><p class="muted">Versão 1.0 (em teste)</p>
   <div class="card"><h3>O que é</h3><p>Um curso de teclado para iniciantes, com lições, exercícios e músicas. O app confere o que você toca, indica o dedo de cada nota e monta um treino diário de acordo com o seu nível.</p></div>
   <div class="card exp"><h3>Duas formas de abrir o app</h3>
     ${location.protocol==='https:'?'<p style="color:var(--ok);font-weight:800">✓ Você abriu pelo link: tudo funciona, inclusive microfone e cabo USB.</p>':'<p style="color:var(--bad);font-weight:800">Você abriu pelo arquivo: microfone e cabo USB provavelmente não vão funcionar. Use o link abaixo para isso.</p>'}
     <ul>
     <li><b>Pelo link (recomendado):</b> <a href="${LINK_APP}" style="color:var(--accent);font-weight:800;word-break:break-all">${LINK_APP}</a><br>Funciona tudo, inclusive <b>microfone</b> e <b>cabo USB</b>, e você sempre recebe a versão mais nova. O <b>microfone liga sozinho</b> ao abrir (na primeira vez o Chrome pede permissão; depois, basta tocar uma vez na tela).</li>
     <li><b>Pelo arquivo</b> (aprenda-teclado.html, aberto no celular com o Chrome): funcionam as lições, os exercícios, as músicas e o teclado da tela. Microfone e cabo USB <b>não</b> funcionam, porque o navegador só libera esses recursos em endereços https.</li>
     <li>O progresso (estrelas, plano e anotações) fica salvo <b>separado</b> em cada forma de abrir. Para não perder nada, escolha uma e use sempre ela.</li></ul></div>
   ${installCard()}
   <div class="card exp"><h3>📱 Uso no iPhone</h3>
     <p><b>Funciona:</b></p><ul>
     <li>Lições, exercícios, músicas, plano, treino do dia, conquistas e o teclado da tela.</li>
     <li><b>Microfone</b>: reconhece as notas do seu teclado. O Safari pede permissão, às vezes a cada vez que o app é aberto.</li>
     <li>Lição de <b>dinâmica</b> (forte e piano), pelo microfone.</li>
     <li><b>Importar partitura</b>: escolha o arquivo pelo app Arquivos. Se um .mxl der erro, use .musicxml ou .mid.</li>
     <li><b>Sem internet</b>: depois de aberto uma vez pelo link.</li></ul>
     <p><b>Não funciona:</b></p><ul>
     <li><b>Cabo USB (MIDI)</b>: a Apple não libera esse recurso para sites, em nenhum navegador do iPhone. Por isso a prática da lição de <b>pedal</b> não confere o pedal (marque como feito) e acordes só são reconhecidos tocando na tela.</li></ul>
     <p><b>Cuidados:</b></p><ul>
     <li><b>Som</b>: com a chave lateral no modo silencioso, o app pode ficar mudo. Desligue o silencioso.</li>
     <li><b>Instalar</b>: no Safari, Compartilhar (quadrado com seta) → <b>Adicionar à Tela de Início</b>.</li>
     <li><b>Progresso</b>: fica só no iPhone. O Safari pode apagar dados de sites que ficam mais de uma semana sem ser abertos; usar pelo ícone na tela de início e com frequência reduz esse risco.</li></ul></div>
   <div class="card exp"><h3>Como usar</h3><ul>
     <li>Abra no <b>Chrome do Android</b>. No iPhone o app funciona, mas o cabo USB (MIDI) não.</li>
     <li>Comece por <b>🎤 Teste seu teclado</b> para ver se o microfone ou o cabo reconhecem as notas.</li>
     <li>Depois toque em <b>🧭 Comece aqui</b> e responda 3 perguntas para montar o seu plano.</li>
     <li>Para ter um atalho, no Chrome: menu ⋮ → <b>Adicionar à tela inicial</b>.</li>
     <li>O progresso fica salvo só neste celular.</li></ul></div>
   <div class="card exp"><h3>Como enviar sua opinião</h3><ul>
     <li>Durante o uso, toque no <b>📝</b> no topo da tela para anotar qualquer problema ou sugestão.</li>
     <li>No fim, abra <b>Anotações do teste → Copiar tudo</b> e mande para quem te enviou o link.</li></ul></div>
   <div class="card"><h3>Situação do app</h3><p><b>${f} funções prontas.</b> O app está completo para estudar; a versão ainda está em teste com os primeiros usuários.</p>
     <p style="margin-bottom:4px"><b>✅ Prontas (${f})</b></p><ul style="margin:0 0 10px;padding-left:18px;line-height:1.5">${FEITAS.map(x=>`<li>${x}</li>`).join('')}</ul>
     <p style="margin-bottom:4px"><b>💡 Possíveis melhorias futuras (${FALTAM.length})</b></p><ul style="margin:0;padding-left:18px;line-height:1.5">${FALTAM.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="card"><h3>Músicas e direitos autorais</h3><p>O app não reproduz a melodia nem a letra de músicas protegidas por direitos autorais. Nesses casos, inclui apenas um arranjo próprio de acompanhamento (acordes e baixo). Na versão atual, isso vale para <b>Let It Be</b> (The Beatles). As outras ${SONGS.length-1} músicas estão em domínio público.</p></div>
   <div class="card" style="text-align:center"><p style="margin:0">Desenvolvido por <b>Guido Roberto do Rêgo Cavalcanti Júnior</b><br>usando o Claude (IA da Anthropic)</p></div>`;
}

/* início */
/* entrada ao abrir: pelo link (https) liga o microfone sozinho; pelo arquivo usa a tela */
const VIA_LINK=location.protocol==='https:';
document.addEventListener('pointerdown',()=>{if(AC&&AC.state!=='running')AC.resume().then(updChip)},true);
if(!VIA_LINK){if(S.input!=='touch'){S.input='touch';saveSettings()}}
else if(S.input==='midi'){startMidi()}
else if(!S.userTouch){ac();startMic().then(()=>{updChip();if(AC)AC.onstatechange=updChip})}
function applyTheme(){document.body.classList.toggle('dark',S.theme==='dark');const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=S.theme==='dark'?'#14161c':'#f6f3ee'}
/* app instalável e sem internet (só pelo link https) */
let INSTALL_EVT=null;const IS_APP=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;document.querySelectorAll('.instOnly').forEach(x=>x.style.display='')});
if(VIA_LINK&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function installApp(){if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;document.querySelectorAll('.instOnly').forEach(x=>x.style.display='none')})}}
function installCard(){
  if(!VIA_LINK)return `<div class="card"><h3>📲 Instalar como app e usar sem internet</h3><p class="muted small">Disponível só abrindo pelo link. Pelo arquivo, o app não pode ser instalado.</p></div>`;
  if(IS_APP)return `<div class="card"><h3>📲 App instalado</h3><p class="muted small">✓ Você está usando o app instalado. Ele funciona mesmo sem internet (o microfone continua funcionando; as atualizações chegam quando houver conexão).</p></div>`;
  return `<div class="card"><h3>📲 Instalar como app e usar sem internet</h3><p class="muted small">Depois de aberto uma vez pelo link, o app funciona mesmo sem internet. Instalado, ele ganha ícone próprio e abre em tela cheia.</p>
    <button class="btn primary instOnly" style="${INSTALL_EVT?'':'display:none'}" onclick="installApp()">📲 Instalar o app</button>
    <p class="muted small" style="margin-top:8px">Se o botão não aparecer: no Chrome, menu ⋮ → <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>). No iPhone, Safari → Compartilhar → <b>Adicionar à Tela de Início</b>.</p></div>`;
}
applyTheme();updChip();go(viewHome);

</script>
</body>
</html>
